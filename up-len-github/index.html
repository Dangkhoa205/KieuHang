<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chúc mừng 20/10 💐</title>
<meta name="theme-color" content="#f7d5dc" />
<!-- Ảnh xem trước khi gửi link qua Messenger/Zalo -->
<meta property="og:title" content="Chúc mừng 20/10 💐" />
<meta property="og:description" content="Có một lá thư và một món quà nhỏ đang chờ em mở 💌" />

<!-- ============ GOOGLE FONTS ============ -->
<!-- Dancing Script: font viết tay | Be Vietnam Pro: chữ tiếng Việt dễ đọc -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
/* =========================================================
   1. BIẾN MÀU & THIẾT LẬP CHUNG
   Chỉnh tông màu tại đây (hồng pastel + kem + đỏ rượu vang)
   ========================================================= */
:root{
  --pink:        #f7c6d2;   /* hồng pastel */
  --pink-soft:   #fde4ea;   /* hồng nhạt */
  --cream:       #fff6ef;   /* kem */
  --cream-deep:  #fbeee2;   /* kem đậm */
  --wine:        #7d2436;   /* đỏ rượu vang (chữ chính) */
  --wine-soft:   #a23b52;   /* đỏ rượu nhạt */
  --rose:        #e8637c;   /* hồng đậm (nút/nhấn) */
  --gold:        #d9a86c;   /* điểm nhấn vàng ấm */
  --ink:         #5a3a40;   /* chữ phụ */
  --white-glass: rgba(255,255,255,.72);
  --shadow:      0 14px 40px rgba(125,36,54,.18);
  --shadow-sm:   0 6px 18px rgba(125,36,54,.14);
  --radius:      22px;
  --font-hand:   'Dancing Script', cursive;
  --font-body:   'Be Vietnam Pro', system-ui, sans-serif;
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

html,body{ height:100%; }

body{
  font-family:var(--font-body);
  color:var(--ink);
  background:
    radial-gradient(130% 90% at 50% 0%, var(--pink-soft) 0%, var(--cream) 45%, var(--cream-deep) 100%);
  overflow:hidden;
  position:relative;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* Khung chính căn giữa, tối đa ~480px, mobile-first */
#app{
  position:relative;
  width:100%;
  max-width:480px;
  height:100%;
  height:100dvh;
  margin:0 auto;
  overflow:hidden;
  z-index:2;
}

/* =========================================================
   2. CÁC MÀN HÌNH (screen) – chồng lên nhau, fade chuyển cảnh
   ========================================================= */
.screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:28px 24px;
  text-align:center;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .55s ease;
}
.screen.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

/* =========================================================
   3. NÚT CHUNG
   ========================================================= */
.btn{
  font-family:var(--font-body);
  font-weight:600;
  font-size:1.05rem;
  color:#fff;
  background:linear-gradient(135deg, var(--rose), var(--wine-soft));
  border:none;
  border-radius:999px;
  padding:16px 30px;
  min-height:54px;
  cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
  letter-spacing:.2px;
}
.btn:active{ transform:scale(.95); }
.btn.ghost{
  background:var(--white-glass);
  color:var(--wine);
  border:1.5px solid var(--pink);
  backdrop-filter:blur(6px);
}
.btn-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:26px; }

/* =========================================================
   4. MÀN TẢI (loading)
   ========================================================= */
#loader .heart-beat{
  font-size:70px;
  line-height:1;
  margin-bottom:26px;
  filter:drop-shadow(0 8px 14px rgba(232,99,124,.4));
  animation:beat 1s ease-in-out infinite;
}
@keyframes beat{
  0%,100%{ transform:scale(1); }
  25%{ transform:scale(1.18); }
  40%{ transform:scale(.96); }
}
#loader .load-title{
  font-family:var(--font-hand);
  font-size:2rem;
  color:var(--wine);
  margin-bottom:22px;
}
.progress-wrap{
  width:220px;
  height:12px;
  background:var(--pink-soft);
  border-radius:999px;
  overflow:hidden;
  box-shadow:inset 0 2px 5px rgba(125,36,54,.12);
}
.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg, var(--rose), var(--gold));
  border-radius:999px;
  transition:width .2s ease;
}
.progress-num{ margin-top:12px; font-size:.9rem; color:var(--wine-soft); font-weight:600; }
#openBtn{ margin-top:30px; opacity:0; transform:translateY(14px); transition:opacity .5s, transform .5s; }
#openBtn.show{ opacity:1; transform:translateY(0); animation:floatBtn 2.4s ease-in-out infinite 0.6s; }
@keyframes floatBtn{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }

/* =========================================================
   5. MÀN PHONG BÌ (envelope)
   ========================================================= */
.env-hint{ font-family:var(--font-hand); font-size:1.5rem; color:var(--wine-soft); margin-bottom:26px; }
.envelope{
  position:relative;
  width:290px;
  height:195px;
  cursor:pointer;
  perspective:800px;
  filter:drop-shadow(var(--shadow));
}
/* thân phong bì */
.env-body{
  position:absolute; inset:0;
  background:linear-gradient(135deg, #fbe0d2, #f6cdbb);
  border-radius:12px;
  overflow:hidden;
}
/* tam giác đáy (các mép gập) */
.env-body::before{
  content:""; position:absolute; inset:0;
  background:
    linear-gradient(to bottom right, transparent 49.6%, rgba(125,36,54,.08) 50%) left/50% 100% no-repeat,
    linear-gradient(to bottom left,  transparent 49.6%, rgba(125,36,54,.08) 50%) right/50% 100% no-repeat;
}
/* lá thư bên trong */
.env-letter{
  position:absolute;
  left:12px; right:12px; bottom:10px;
  height:150px;
  background:var(--cream);
  border-radius:8px 8px 4px 4px;
  box-shadow:0 -4px 12px rgba(125,36,54,.08);
  z-index:2;
  transform:translateY(0);
  transition:transform .6s cubic-bezier(.22,1,.36,1);
  padding:16px;
  display:flex; align-items:center; justify-content:center;
}
.env-letter span{ font-family:var(--font-hand); color:var(--wine-soft); font-size:1.4rem; opacity:.5; }
/* nắp trên (gập xuống / mở lên) */
.env-flap{
  position:absolute;
  top:0; left:0; right:0;
  height:50%;
  background:linear-gradient(135deg, #f6cdbb, #eeb6a3);
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  transform-origin:top;
  transition:transform .55s ease;
  z-index:4;
  border-radius:12px 12px 0 0;
}
/* tim niêm phong */
.env-seal{
  position:absolute;
  top:42%; left:50%;
  transform:translate(-50%,-50%);
  font-size:40px;
  z-index:5;
  filter:drop-shadow(0 4px 8px rgba(125,36,54,.3));
  transition:opacity .3s, transform .3s;
  animation:sealPulse 1.6s ease-in-out infinite;
}
@keyframes sealPulse{ 0%,100%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-50%,-50%) scale(1.12);} }
/* trạng thái mở */
.envelope.open .env-flap{ transform:rotateX(180deg); z-index:1; }
.envelope.open .env-seal{ opacity:0; transform:translate(-50%,-50%) scale(0); }
.envelope.open .env-letter{ transform:translateY(-120px); z-index:6; }

/* =========================================================
   6. MÀN LÁ THƯ (letter)
   ========================================================= */
.letter-card{
  width:100%;
  background:var(--cream);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:30px 26px 34px;
  position:relative;
  border:1px solid rgba(217,168,108,.25);
}
.letter-card::after{
  /* đường viền trang trí */
  content:""; position:absolute; inset:10px;
  border:1px dashed rgba(162,59,82,.25);
  border-radius:16px; pointer-events:none;
}
.letter-greet{
  font-family:var(--font-hand);
  font-size:2rem;
  color:var(--wine);
  margin-bottom:16px;
}
.letter-body{
  font-size:1.05rem;
  line-height:1.85;
  color:var(--ink);
  min-height:150px;
  text-align:left;
  white-space:pre-wrap;
}
.letter-body .cursor{
  display:inline-block;
  width:2px; height:1.1em;
  background:var(--wine-soft);
  margin-left:1px;
  vertical-align:text-bottom;
  animation:blink .8s steps(1) infinite;
}
@keyframes blink{ 50%{opacity:0;} }
.letter-sign{
  font-family:var(--font-hand);
  font-size:1.5rem;
  color:var(--wine-soft);
  text-align:right;
  margin-top:18px;
  opacity:0;
  transition:opacity .6s;
}
.letter-sign.show{ opacity:1; }

/* =========================================================
   7. MÀN MÁY ẢNH LẤY LIỀN (camera + polaroid)
   ========================================================= */
#camera .cam-stage{
  position:relative;
  width:100%;
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.cam-title{ font-family:var(--font-hand); font-size:1.7rem; color:var(--wine); margin-bottom:6px; }
.cam-sub{ font-size:.88rem; color:var(--wine-soft); margin-bottom:18px; }

/* máy ảnh vẽ bằng CSS */
.instant-cam{
  position:relative;
  width:190px; height:150px;
  background:linear-gradient(160deg,#fbe3ea,#f3b9c9);
  border-radius:20px;
  box-shadow:var(--shadow), inset 0 -8px 16px rgba(125,36,54,.08);
  margin-bottom:10px;
  z-index:5;
  flex:0 0 auto;
}
.instant-cam .cam-top{
  position:absolute; top:-10px; left:28px;
  width:60px; height:16px;
  background:#eaa7b9; border-radius:8px 8px 0 0;
}
.instant-cam .cam-flash{
  position:absolute; top:20px; right:26px;
  width:26px; height:18px;
  background:#fff3c4; border-radius:5px;
  box-shadow:0 0 0 3px rgba(255,255,255,.4);
}
.instant-cam .cam-lens{
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-45%);
  width:72px; height:72px; border-radius:50%;
  background:radial-gradient(circle at 38% 34%, #ffffff 0%, #c98499 30%, #6c2236 75%);
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.55), 0 4px 10px rgba(125,36,54,.3);
}
.instant-cam .cam-lens::after{
  content:""; position:absolute; top:20%; left:22%;
  width:14px; height:14px; border-radius:50%;
  background:rgba(255,255,255,.75);
}
.instant-cam .cam-slot{
  position:absolute; bottom:-4px; left:50%;
  transform:translateX(-50%);
  width:130px; height:8px;
  background:#6c2236; border-radius:4px;
}

/* khu vực polaroid rơi ra */
.polaroid-area{
  position:relative;
  width:230px; height:250px;
  margin-top:4px;
}
.polaroid{
  position:absolute;
  top:0; left:50%;
  width:200px;
  background:#fff;
  padding:12px 12px 0;
  border-radius:6px;
  box-shadow:0 10px 26px rgba(125,36,54,.22);
  transform-origin:center;
}
.polaroid .pola-img{
  width:100%; height:180px;
  object-fit:cover;
  border-radius:3px;
  background:var(--pink-soft);
  display:block;
  filter:blur(14px) saturate(.4);
  opacity:.4;
  transition:filter 1.1s ease, opacity 1.1s ease;
}
.polaroid.developed .pola-img{ filter:blur(0) saturate(1); opacity:1; }
.polaroid .pola-cap{
  font-family:var(--font-hand);
  font-size:1.25rem;
  color:var(--wine);
  text-align:center;
  padding:8px 4px 12px;
  line-height:1.2;
}
.cam-counter{ font-size:.85rem; color:var(--wine-soft); margin-top:22px; font-weight:600; position:relative; z-index:20; }

/* flash chớp trắng toàn màn hình */
#flash{
  position:fixed; inset:0;
  background:#fff;
  opacity:0;
  pointer-events:none;
  z-index:999;
}

/* =========================================================
   8. MÀN HỘP QUÀ (gift)
   ========================================================= */
.q-title{
  font-family:var(--font-hand);
  font-size:2.2rem;
  color:var(--wine);
  margin-bottom:8px;
  line-height:1.2;
}
.q-sub{ font-size:.95rem; color:var(--wine-soft); margin-bottom:40px; }
.gift{
  position:relative;
  width:170px; height:170px;
  cursor:pointer;
  filter:drop-shadow(var(--shadow));
  animation:giftWiggle 2.2s ease-in-out infinite;
}
@keyframes giftWiggle{
  0%,70%,100%{ transform:rotate(0); }
  76%{ transform:rotate(-6deg); } 82%{ transform:rotate(6deg); }
  88%{ transform:rotate(-4deg); } 94%{ transform:rotate(3deg); }
}
.gift-box{
  position:absolute; left:10px; right:10px; bottom:0; height:115px;
  background:linear-gradient(135deg, var(--rose), var(--wine-soft));
  border-radius:8px;
}
.gift-lid{
  position:absolute; left:0; right:0; top:28px; height:34px;
  background:linear-gradient(135deg, #ef7d93, var(--rose));
  border-radius:8px;
  z-index:3;
}
/* ruy băng dọc */
.gift-box::before, .gift-lid::before{
  content:""; position:absolute; top:0; bottom:0; left:50%;
  width:24px; transform:translateX(-50%);
  background:var(--gold);
}
/* nơ */
.gift-bow{
  position:absolute; left:50%; top:-26px;
  transform:translateX(-50%);
  font-size:44px; line-height:1;
}
.gift.open{ animation:none; }
.gift-hint{ margin-top:30px; color:var(--wine-soft); font-size:.9rem; }

/* =========================================================
   9. MÀN KẾT THÚC (final)
   ========================================================= */
.final-emoji{ font-size:64px; margin-bottom:12px; animation:beat 1.2s ease-in-out infinite; }
.final-title{
  font-family:var(--font-hand);
  font-size:2.1rem;
  color:var(--wine);
  line-height:1.25;
  margin-bottom:22px;
}
.date-card{
  width:100%;
  background:var(--white-glass);
  backdrop-filter:blur(8px);
  border:1.5px solid var(--pink);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  padding:22px 24px;
  text-align:left;
}
.date-row{ display:flex; align-items:center; gap:12px; padding:9px 0; font-size:1rem; color:var(--ink); }
.date-row + .date-row{ border-top:1px dashed rgba(162,59,82,.2); }
.date-row .ic{ font-size:22px; flex:0 0 auto; }
.date-row b{ color:var(--wine); font-weight:600; }


/* =========================================================
   9b. MÀN HẸN HÒ (tông nâu tối, như ảnh mẫu)
   ========================================================= */
[hidden]{ display:none !important; }
:root{
  --night-bg:     #2a241e;   /* nền nâu tối */
  --night-card:   rgba(40,35,31,.94);
  --night-line:   rgba(233,201,160,.14);
  --night-title:  #ecd2ae;   /* chữ kem vàng */
  --night-soft:   #b89470;   /* chữ phụ */
  --night-accent: #b97a4a;   /* nút caramel */
}
/* lớp nền tối phủ lên khi vào màn hẹn hò */
#nightBg{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(120% 80% at 50% 0%, #3a3128 0%, var(--night-bg) 55%, #4a3b24 100%);
  opacity:0; transition:opacity .9s ease;
}
body.night #nightBg{ opacity:1; }
body.night #bgFloat{ opacity:.35; }
.night-card{
  width:100%;
  display:flex; flex-direction:column; align-items:center;
  background:var(--night-card);
  border:1px solid var(--night-line);
  border-radius:20px;
  padding:26px 20px 22px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}
.night-photo{
  width:200px; max-width:70%;
  background:#141414;
  padding:9px;
  border-radius:6px;
  transform:rotate(-3deg);
  box-shadow:0 12px 28px rgba(0,0,0,.5);
}
.night-photo img{ width:100%; aspect-ratio:4/5; object-fit:cover; display:block; border-radius:2px; }
.night-eyebrow{ font-family:var(--font-hand); color:#c99a62; font-size:1.1rem; margin-top:14px; }
.night-title{
  font-family:var(--font-hand); color:var(--night-title);
  font-size:2.55rem; line-height:1.12; margin-top:2px; text-wrap:balance;
}
.night-sub{ font-family:var(--font-hand); color:var(--night-soft); font-size:1.25rem; margin-top:8px; }
.night-actions{ width:100%; display:flex; flex-direction:column; align-items:center; }
.btn.night-yes{
  margin-top:22px;
  background:var(--night-accent); color:#fff8ef;
  font-size:1.15rem; padding:17px 40px;
  box-shadow:0 10px 30px rgba(185,122,74,.35);
  transition:transform .25s ease;
}
.btn.night-no{
  background:#2c2825; color:#e8d6bf;
  border:1px solid var(--night-line);
  font-weight:500; font-size:.95rem; box-shadow:none;
}
.night-zone{ position:relative; width:100%; height:96px; margin-top:8px; }
#noBtn{
  position:absolute; left:50%; top:22px;
  transform:translateX(-50%);
  white-space:nowrap;
  transition:left .3s ease, top .3s ease, transform .3s ease, opacity .3s;
}
.night-answer{ display:flex; flex-direction:column; align-items:center; animation:fadeUp .7s ease both; }
.night-answer-title{
  font-family:var(--font-hand); color:var(--night-title);
  font-size:2.4rem; line-height:1.15; margin-top:18px; text-wrap:balance;
}
.night-answer-sub{ color:var(--night-soft); font-size:.98rem; margin-top:10px; }
.night-answer .btn{ margin-top:22px; }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:none;} }
@media (max-height:740px){
  .night-photo{ width:150px; }
  .night-title{ font-size:2.1rem; }
  .night-zone{ height:80px; }
}
@media (prefers-reduced-motion: reduce){ .night-answer{ animation:none; } }

/* =========================================================
   10. NÚT NHẠC (đĩa xoay) + NỀN BAY LƠ LỬNG
   ========================================================= */
#musicBtn{
  position:fixed;
  top:14px; right:14px;
  width:46px; height:46px;
  border-radius:50%;
  border:none;
  background:var(--white-glass);
  backdrop-filter:blur(6px);
  box-shadow:var(--shadow-sm);
  cursor:pointer;
  z-index:50;
  display:flex; align-items:center; justify-content:center;
  font-size:22px;
}
#musicBtn .disc{ display:inline-block; animation:spin 3.5s linear infinite; }
#musicBtn.paused .disc{ animation-play-state:paused; filter:grayscale(.6) opacity(.7); }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* lớp nền trái tim/cánh hoa bay */
#bgFloat{
  position:fixed; inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:1;
}
.float-item{
  position:absolute;
  bottom:-40px;
  font-size:20px;
  opacity:0;
  animation:floatUp linear infinite;
  will-change:transform, opacity;
}
@keyframes floatUp{
  0%{ transform:translateY(0) rotate(0deg); opacity:0; }
  10%{ opacity:.55; }
  90%{ opacity:.45; }
  100%{ transform:translateY(-110vh) rotate(260deg); opacity:0; }
}

/* =========================================================
   11. TÔN TRỌNG prefers-reduced-motion
   ========================================================= */
@media (prefers-reduced-motion: reduce){
  .heart-beat, #openBtn.show, .env-seal, .final-emoji, #musicBtn .disc, .float-item{ animation:none !important; }
  .screen{ transition:opacity .2s linear; }
  *{ scroll-behavior:auto; }
}

/* màn hình rất nhỏ */
@media (max-height:680px){
  .instant-cam{ width:150px; height:118px; }
  .instant-cam .cam-lens{ width:58px; height:58px; }
  .polaroid-area{ height:220px; }
  .polaroid{ width:170px; }
  .polaroid .pola-img{ height:150px; }
}
</style>
</head>
<body>

<!-- Lớp nền trái tim/cánh hoa bay (JS tự đổ vào) -->
<div id="bgFloat" aria-hidden="true"></div>
<!-- Nền nâu tối cho màn hẹn hò -->
<div id="nightBg" aria-hidden="true"></div>

<!-- Nút bật/tắt nhạc dạng đĩa xoay -->
<button id="musicBtn" class="paused" aria-label="Bật/tắt nhạc">
  <span class="disc">💿</span>
</button>

<!-- Flash chớp trắng -->
<div id="flash" aria-hidden="true"></div>

<!-- Thẻ audio nhạc nền (nguồn trong CONFIG) -->
<audio id="bgm" loop preload="auto"></audio>

<main id="app">

  <!-- ===== 1. MÀN TẢI ===== -->
  <section class="screen active" id="loader">
    <div class="heart-beat">💖</div>
    <div class="load-title">Đang gói quà 20/10 cho em…</div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-num" id="progressNum">0%</div>

<script>

  question: "Anh có một món quà cho em 🎁",

  finalPhoto: "anh/1.jpg",            // ảnh trong khung ở màn cuối
  nightEyebrow: "gửi em",
  nightTitle: "Em đi hẹn hò với anh nhé?",
  nightSub: "Từ chối khó ghê ha? Hihi 🙈",
  yesText: "Đồng ý luôn!",

  answerTitle: "Anh ở ngay dưới nè, em xuống đi! 🥰",

/* =========================================================================
   XỬ LÝ THAM SỐ URL:  ?autoplay=0 tắt tự phát  |  ?muted=1 tắt tiếng
   ========================================================================= */
const params = new URLSearchParams(location.search);
const AUTOPLAY = params.get("autoplay") !== "0";  // mặc định bật
const MUTED    = params.get("muted") === "1";     // mặc định có tiếng

// Tôn trọng prefers-reduced-motion
const REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* =========================================================================
   TIỆN ÍCH
   ========================================================================= */
const $  = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

// Ảnh placeholder (SVG data-uri) khi ảnh thật lỗi/không tồn tại
function placeholderDataURI(text){
  const t = (text || "Ảnh kỷ niệm").slice(0, 22);
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='360'>
    <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#fde4ea'/><stop offset='1' stop-color='#f7c6d2'/>
    </linearGradient></defs>
    <rect width='400' height='360' fill='url(#g)'/>
    <text x='50%' y='46%' font-family='sans-serif' font-size='54' text-anchor='middle'>📷</text>
    <text x='50%' y='62%' font-family='sans-serif' font-size='22' fill='#a23b52' text-anchor='middle'>${t}</text>
  </svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

// Chuyển màn hình (fade mượt)
let currentScreen = "loader";
function showScreen(id){
  const cur = document.getElementById(currentScreen);
  const next = document.getElementById(id);
  if(cur) cur.classList.remove("active");
  if(next){ next.classList.add("active"); currentScreen = id; }
}

/* =========================================================================
   NỀN TRÁI TIM / CÁNH HOA BAY LƠ LỬNG
   ========================================================================= */
function initBackground(){
  if(REDUCE) return; // bỏ qua nếu người dùng muốn giảm chuyển động
  const bg = $("#bgFloat");
  const emojis = ["🌸","💐","🌷","🌹","💕","🤍"];
  const COUNT = 14;
  for(let i=0;i<COUNT;i++){
    const el = document.createElement("span");
    el.className = "float-item";
    el.textContent = emojis[i % emojis.length];
    el.style.left = Math.random()*100 + "%";
    el.style.fontSize = (14 + Math.random()*16) + "px";
    el.style.animationDuration = (14 + Math.random()*14) + "s";
    el.style.animationDelay = (-Math.random()*20) + "s";
    bg.appendChild(el);
  }
}

/* =========================================================================
   NHẠC NỀN
   ========================================================================= */
const bgm = $("#bgm");
const musicBtn = $("#musicBtn");
let musicReady = false;

function setupMusic(){
  bgm.src = CONFIG.musicSrc;
  bgm.muted = MUTED;
  // Nếu file nhạc lỗi, ẩn nút nhạc đi cho gọn
  bgm.addEventListener("error", ()=>{ musicBtn.style.display = "none"; });
}

function tryPlayMusic(){
  if(!AUTOPLAY) { updateMusicIcon(); return; }
  bgm.play().then(()=>{
    musicReady = true;
    updateMusicIcon();
  }).catch(()=>{ updateMusicIcon(); });
}

function updateMusicIcon(){
  const playing = !bgm.paused && !bgm.muted;
  musicBtn.classList.toggle("paused", !playing);
}

musicBtn.addEventListener("click", ()=>{
  if(bgm.paused){
    bgm.muted = false;
    bgm.play().catch(()=>{});
  } else {
    bgm.pause();
  }
  updateMusicIcon();
});

/* =========================================================================
   MÀN 1 – TẢI: thanh tiến độ + nút mở
   ========================================================================= */
/* Tự tìm ảnh trong thư mục: anh/1.jpg, anh/2.png… (dừng ở số đầu tiên bị thiếu) */
let PHOTOS = [];
const EXTS = ["jpg","jpeg","png","webp","JPG","JPEG","PNG","WEBP"];

function probeImage(url){
  return new Promise((resolve)=>{
    const im = new Image();
    im.onload  = ()=> resolve(url);
    im.onerror = ()=> resolve(null);
    im.src = url;
  });
}
async function findPhoto(i){
  for(const ext of EXTS){
    const ok = await probeImage(`${CONFIG.photoFolder}${i}.${ext}`);
    if(ok) return ok;
  }
  return null;
}
async function loadPhotos(){
  const found = await Promise.all(
    Array.from({length: CONFIG.maxPhotos}, (_, k)=> findPhoto(k + 1))
  );
  const list = [];
  for(let k = 0; k < found.length; k++){
    if(!found[k]) continue;              // bỏ qua số bị thiếu (vd. không có 3.jpg)
    list.push({ src: found[k], caption: CONFIG.captions[list.length] || "" });
  }
  // Chưa có ảnh nào -> dùng 3 ảnh giả để xem thử bố cục
  if(list.length === 0){
    for(let k = 0; k < 3; k++){
      list.push({ src: placeholderDataURI(CONFIG.captions[k]), caption: CONFIG.captions[k] || "" });
    }
  }
  PHOTOS = list;
}

function runLoader(){
  const bar = $("#progressBar");
  const num = $("#progressNum");
  const openBtn = $("#openBtn");
  let p = 0;
  let photosDone = false;
  loadPhotos().finally(()=>{ photosDone = true; });

  const timer = setInterval(()=>{
    p += Math.random()*14 + 6;
    // giữ ở 92% cho tới khi tải xong ảnh
    if(!photosDone && p > 92) p = 92;
    if(photosDone && p >= 100){ p = 100; clearInterval(timer); openBtn.classList.add("show"); }
    bar.style.width = p + "%";
    num.textContent = Math.round(p) + "%";
  }, 180);

  // Lần chạm đầu tiên: mở màn + bật nhạc (vượt chặn autoplay của trình duyệt)
  openBtn.addEventListener("click", ()=>{
    tryPlayMusic();
    showScreen("envelopeScreen");
  });
}

/* =========================================================================
   MÀN 2 – PHONG BÌ: chạm để mở + tiếng "pop"
   ========================================================================= */
let envOpened = false;  // để ngoài hàm để nút "Xem lại" reset được
function initEnvelope(){
  const env = $("#envelope");

  function openEnvelope(){
    if(envOpened) return;
    envOpened = true;
    env.classList.add("open");
    playPop(); // tiếng pop tạo bằng WebAudio
    // sau khi lá thư trượt lên thì chuyển sang màn lá thư
    setTimeout(()=> showScreen("letterScreen"), 1100);
    setTimeout(()=> startLetter(), 1500);
  }

  env.addEventListener("click", openEnvelope);
  env.addEventListener("keydown", (e)=>{ if(e.key==="Enter"||e.key===" ") openEnvelope(); });
}

// Tiếng "pop" ngắn bằng WebAudio (không cần file âm thanh)
function playPop(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(420, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.22);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.24);
  }catch(e){ /* trình duyệt không hỗ trợ thì bỏ qua */ }
}

/* =========================================================================
   MÀN 3 – LÁ THƯ: hiệu ứng gõ chữ từng dòng
   ========================================================================= */
let letterStarted = false;
function startLetter(){
  if(letterStarted) return;
  letterStarted = true;

  $("#letterGreet").textContent = CONFIG.letterGreet;
  const body = $("#letterBody");
  const sign = $("#letterSign");
  body.innerHTML = "";

  // Nếu giảm chuyển động: hiện thẳng toàn bộ chữ
  if(REDUCE){
    body.textContent = CONFIG.letterLines.join("\n");
    sign.textContent = CONFIG.letterSign;
    sign.classList.add("show");
    return;
  }

  const lines = CONFIG.letterLines;
  let li = 0, ci = 0;
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  body.appendChild(cursor);

  function type(){
    if(li >= lines.length){
      cursor.remove();
      sign.textContent = CONFIG.letterSign;
      sign.classList.add("show");
      return;
    }
    const line = lines[li];
    if(ci < line.length){
      cursor.insertAdjacentText("beforebegin", line[ci]);
      ci++;
      setTimeout(type, CONFIG.typeSpeed);
    } else {
      cursor.insertAdjacentText("beforebegin", "\n\n");
      li++; ci = 0;
      setTimeout(type, 420); // nghỉ giữa các dòng
    }
  }
  type();
}

$("#toCameraBtn").addEventListener("click", ()=>{
  showScreen("camera");
  initCamera();
});

/* =========================================================================
   MÀN 4 – MÁY ẢNH: chụp polaroid, flash, ảnh hiện dần
   ========================================================================= */
let camInited = false;
let shotIndex = 0;
function initCamera(){
  if(camInited) return;
  camInited = true;
  shotIndex = 0;
  updateCamCounter();
  $("#camCounter").textContent = "";
}
function updateCamCounter(){
  const total = PHOTOS.length;
  const c = $("#camCounter");
  if(shotIndex === 0){ c.textContent = ""; }
  else { c.textContent = `Đã chụp ${shotIndex}/${total} tấm`; }
}

const shootBtn = $("#shootBtn");
shootBtn.addEventListener("click", ()=>{
  const total = PHOTOS.length;
  if(shotIndex >= total) return;

  const data = PHOTOS[shotIndex];
  shotIndex++;

  flashScreen();          // chớp trắng
  addPolaroid(data, shotIndex, total);
  updateCamCounter();

  // Đổi nhãn nút
  if(shotIndex < total){
    shootBtn.textContent = "Chụp tấm tiếp theo 📷";
  } else {
    // Chụp hết -> hiện nút tiếp tục
    shootBtn.style.display = "none";
    $("#toQuestionBtn").style.display = "";
  }
});

// Flash chớp trắng toàn màn hình
function flashScreen(){
  if(REDUCE || typeof gsap === "undefined") return;
  const f = $("#flash");
  gsap.fromTo(f, {opacity:0}, {opacity:.9, duration:.08, yoyo:true, repeat:1, ease:"power1.inOut"});
}

// Thêm 1 tấm polaroid trượt ra, ảnh hiện dần
function addPolaroid(data, index, total){
  const area = $("#polaroidArea");
  const card = document.createElement("div");
  card.className = "polaroid";

  // xoay lệch ngẫu nhiên + lệch vị trí để xếp chồng tự nhiên
  const rot = (Math.random()*16 - 8).toFixed(1);
  const offX = (Math.random()*30 - 15).toFixed(0);
  card.style.zIndex = index;

  const img = document.createElement("img");
  img.className = "pola-img";
  img.alt = data.caption || "Ảnh kỷ niệm";
  img.loading = "eager";
  // Ảnh lỗi -> placeholder
  img.onerror = ()=>{ img.onerror=null; img.src = placeholderDataURI(data.caption); };
  img.src = data.src;

  const cap = document.createElement("div");
  cap.className = "pola-cap";
  cap.textContent = data.caption || "";

  card.appendChild(img);
  card.appendChild(cap);
  area.appendChild(card);

  const finalTransform = `translateX(calc(-50% + ${offX}px)) rotate(${rot}deg)`;

  if(REDUCE || typeof gsap === "undefined"){
    card.style.transform = finalTransform;
    card.classList.add("developed");
  } else {
    // bắt đầu từ trong máy ảnh (trên, thu nhỏ) rồi trượt xuống
    gsap.set(card, { x:"-50%", y:-150, scale:.75, rotation:0, opacity:0 });
    gsap.to(card, {
      opacity:1, y:0, scale:1, rotation:parseFloat(rot), x:`calc(-50% + ${offX}px)`,
      duration:.85, ease:"back.out(1.4)",
      onComplete:()=>{
        // ảnh hiện dần từ mờ sang rõ
        setTimeout(()=> card.classList.add("developed"), 150);
      }
    });
  }
}

/* =========================================================================
   MÀN 5 – HỘP QUÀ: chạm để mở, nắp bay lên, pháo giấy
   ========================================================================= */
let giftOpened = false;
function initQuestion(){
  $("#qTitle").textContent = CONFIG.question;
  $("#qSub").textContent = CONFIG.questionSub;
}

function openGift(){
  if(giftOpened) return;
  giftOpened = true;
  const gift = $("#gift");
  gift.classList.add("open");
  playPop();

  const goFinal = ()=>{
    initFinal();
    document.body.classList.add("night");
    showScreen("final");
  };

  if(REDUCE || typeof gsap === "undefined"){ goFinal(); return; }

  // lắc hộp -> nắp bay lên -> sang màn kết thúc
  gsap.timeline({ onComplete: goFinal })
    .to(gift, { rotation:-8, duration:.08, repeat:5, yoyo:true, ease:"power1.inOut" })
    .set(gift, { rotation:0 })
    .to(".gift-lid", { y:-140, rotation:-25, opacity:0, duration:.6, ease:"power2.out" })
    .to(".gift-box", { scale:1.08, duration:.25, yoyo:true, repeat:1 }, "<");
}
$("#gift").addEventListener("click", openGift);
$("#gift").addEventListener("keydown", (e)=>{ if(e.key==="Enter"||e.key===" ") openGift(); });

/* =========================================================================
   MÀN 6 – HẸN HÒ: nút "suy nghĩ" chạy trốn, bấm Đồng ý -> "Anh ở ngay dưới nè"
   ========================================================================= */
let finalInited = false;
let dodgeCount = 0;
function initFinal(){
  const img = $("#nightImg");
  img.onerror = ()=>{ img.onerror = null; img.src = placeholderDataURI("Ảnh của mình"); };
  img.src = CONFIG.finalPhoto || (PHOTOS[0] && PHOTOS[0].src) || placeholderDataURI("Ảnh của mình");
  $("#nightEyebrow").textContent = CONFIG.nightEyebrow;
  $("#nightTitle").textContent   = CONFIG.nightTitle;
  $("#nightSub").textContent     = CONFIG.nightSub;
  $("#yesBtn").textContent       = CONFIG.yesText;
  $("#noBtn").textContent        = CONFIG.noText;
  $("#answerTitle").textContent  = CONFIG.answerTitle;
  $("#answerSub").textContent    = CONFIG.answerSub;
  if(finalInited) return;
  finalInited = true;

  const zone = $("#noZone");
  const yes  = $("#yesBtn");
  const no   = $("#noBtn");

  function dodge(){
    dodgeCount++;
    no.textContent = CONFIG.noTexts[(dodgeCount - 1) % CONFIG.noTexts.length];
    const maxX = Math.max(0, zone.clientWidth  - no.offsetWidth  - 4);
    const maxY = Math.max(0, zone.clientHeight - no.offsetHeight - 4);
    const scale = Math.max(0.7, 1 - dodgeCount * 0.05);
    no.style.left = (Math.random() * maxX) + "px";
    no.style.top  = (Math.random() * maxY) + "px";
    no.style.transform = `scale(${scale})`;
    yes.style.transform = `scale(${Math.min(1.35, 1 + dodgeCount * 0.06)})`;
  }
  no.addEventListener("mouseenter", dodge);
  no.addEventListener("click", (e)=>{ e.preventDefault(); dodge(); });
  no.addEventListener("touchstart", (e)=>{ e.preventDefault(); dodge(); }, {passive:false});

  yes.addEventListener("click", ()=>{
    $("#nightActions").hidden = true;
    $("#nightSub").hidden = true;
    $("#nightAnswer").hidden = false;
    playPop();
    celebrate();
  });
}
function resetFinal(){
  dodgeCount = 0;
  document.body.classList.remove("night");
  $("#nightActions").hidden = false;
  $("#nightSub").hidden = false;
  $("#nightAnswer").hidden = true;
  const no = $("#noBtn");
  no.style.left = ""; no.style.top = ""; no.style.transform = "";
  $("#yesBtn").style.transform = "";
}

// Pháo giấy hình trái tim
function celebrate(){
  if(REDUCE || typeof confetti !== "function") return;

  // tạo hình trái tim từ path SVG
  let heart;
  try{
    heart = confetti.shapeFromPath({
      path: "M167 72c19,-38 37,-56 75,-56 42,0 76,33 76,75 0,76 -76,151 -151,205 -76,-54 -151,-129 -151,-205 0,-42 33,-75 75,-75 38,0 57,18 75,56z"
    });
  }catch(e){ heart = undefined; }

  const colors = ["#e8637c","#f7c6d2","#d9a86c","#ecd2ae","#b97a4a"];
  const shapes = heart ? [heart] : undefined;

  // bắn vài đợt
  const burst = (x)=> confetti({
    particleCount: 36,
    spread: 70,
    startVelocity: 48,
    origin:{ x, y:0.7 },
    colors,
    shapes,
    scalar: 1.4,
    ticks: 240
  });

  burst(0.25); burst(0.5); burst(0.75);
  setTimeout(()=>{ burst(0.35); burst(0.65); }, 350);
  setTimeout(()=>{ burst(0.5); }, 750);
}

/* =========================================================================
   NÚT XEM LẠI TỪ ĐẦU
   ========================================================================= */
$("#replayBtn").addEventListener("click", ()=>{
  // reset các trạng thái
  letterStarted = false;
  camInited = false;
  shotIndex = 0;
  $("#polaroidArea").innerHTML = "";
  $("#letterBody").innerHTML = "";
  $("#letterSign").classList.remove("show");
  $("#envelope").classList.remove("open");
  envOpened = false;

  $("#gift").classList.remove("open");
  if(typeof gsap !== "undefined") gsap.set([".gift-lid", ".gift-box", "#gift"], { clearProps:"all" });
  shootBtn.style.display = "";
  shootBtn.textContent = "Chụp tấm đầu tiên 📷";
  $("#toQuestionBtn").style.display = "none";
  // quay về màn phong bì (bỏ qua loading cho nhanh)
  showScreen("envelopeScreen");
});
